<h1>Moodle-Sync</h1>
<p>Moodle-Sync is a personal, single-user tool that copies course files from the user's own Moodle account into their own Google Drive folder and adds assignment deadlines to their own Google Calendar.</p>
<p>It is not offered to the public and has no other users.</p>
